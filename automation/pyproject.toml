[project]
name = "flatfinder"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "crawlee[playwright]==1.9.1",
  "playwright==1.62.0",
  "Pillow==12.3.0",
  "streamlit==1.61.1",
  "osmium==4.3.1",
  "shapely==2.1.2",
]

[project.scripts]
flatfinder = "flatfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.12.5"
