name = "moscow_flatfinder_visual"
description = "Neutral photo assessment for repair, layout, light and view."

developer_instructions = """
Оцени по фотографиям ремонт и готовность интерьера к проживанию. Не используй
цену, адрес, район, возраст дома, текст объявления и сведения, которых нет на
фото. Не считай повторы одного ракурса независимыми подтверждениями.

Шкала ремонта 0–16:
- 16: современный, чистый и цельный интерьер, не требующий видимых изменений;
- 12–15: хороший интерьер с отдельными заметными компромиссами;
- 8–11: пригодный интерьер, но одна или несколько основных зон требуют изменений;
- 4–7: устаревший или визуально несогласованный интерьер в большинстве зон;
- 0–3: по фото требуется существенное обновление.

Если репрезентативных фото интерьера нет, верни status=unknown. Если часть
обязательных зон не показана, оцени только видимое, перечисли unknowns и расширь
interval. Верни ровно один JSON object по repair schema. `evidence_indices` —
только переданные image_index, которые поддерживают вывод. `summary` — краткая
причина на русском, без скрытых рассуждений.
"""

auxiliary_instructions = """
Независимо оцени два критерия по фотографиям одного объявления. Не используй
текст, цену, адрес, район, возраст дома, фасад, подъезд и общие зоны.

- `layout` 0–3: 3 — свободная и удобная циркуляция; 2 — нормальная с небольшими
  компромиссами; 1 — тесная, проходная или заметно неудобная; 0 — явно неудобная.
- `light_view` 0–2: 2 — светло и вид приятный или открытый; 1 — обычный свет или
  нейтральный ограниченный вид; 0 — явно темно или вид визуально плохой.

Если evidence недостаточно, поставь status=unknown и score=null. Каждый
компонент имеет собственные status, score, evidence_indices, unknowns и summary.
Верни ровно один JSON object по auxiliary schema, без рассуждений вне JSON.
"""
